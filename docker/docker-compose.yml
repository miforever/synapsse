name: synapsse

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    # A memory store is only useful if it is there when an agent reaches for
    # it, so both services come back with Docker after a reboot. `unless-stopped`
    # rather than `always`: stopping it by hand should mean it stays stopped.
    restart: unless-stopped
    volumes:
      - synapsse-data:/app/data
      # Survives container recreation so the model is fetched once.
      - synapsse-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      # Generous: the first start downloads the embedding model before the
      # daemon is ready to answer.
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  synapsse-data:
  synapsse-models:
