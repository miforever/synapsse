[project]
name = "synapsse-backend"
version = "0.1.0"
license = "MIT"
description = "SYNAPSSE local-first memory graph daemon backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "fastmcp>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Local semantic search: ONNX inference on CPU, no API and no network
    # after the model is fetched once.
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

# sqlite-vec ships no type information, and numpy's stubs use syntax newer
# than our target version.
[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "numpy.*", "fastembed.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
